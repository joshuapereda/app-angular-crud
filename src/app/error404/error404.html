<!DOCTYPE html>
<html lang="es" style="background:#0d1117;">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<title>404</title>
</head>
<body>

  <div class="terminal">
    <div class="bar">
      <span class="dot r"></span>
      <span class="dot y"></span>
      <span class="dot g"></span>
      <span class="bar-title">joshua@dev: ~/site</span>
    </div>

    <div class="body">
      <div class="line"><span class="prompt">joshua@dev</span><span class="cmd">:</span><span class="path">~</span><span class="cmd">$ cd pagina-no-encontrada</span></div>
      <div class="line"><span class="cmd">bash: cd: pagina-no-encontrada: No such file or directory</span></div>

      <div class="error-code">404</div>
      <div class="msg">Esta ruta no existe <b>en este repositorio</b>. Revisa la URL o vuelve al inicio.</div>

      <div class="line"><span class="prompt">joshua@dev</span><span class="cmd">:</span><span class="path">~</span><span class="cmd">$</span><span class="cursor"></span></div>

      <div class="actions">
        <a routerLink="/inicios" class="btn primary">Volver al inicio</a>
        <a href="#" class="btn">Reportar enlace roto</a>
      </div>
    </div>
  </div>

</body>
</html>
